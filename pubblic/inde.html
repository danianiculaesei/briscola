<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a0a00">
  <title>Briscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-lobby">

  <div class="lobby-wrap">

    <div class="lobby-logo">
      <span class="logo-suit">♠</span>
      <div class="logo-text">Briscola</div>
      <span class="logo-suit red">♥</span>
    </div>

    <!-- SCHERMATA: SCEGLI AZIONE -->
    <div id="screen-home" class="screen active">
      <p class="lobby-sub">Gioco di carte italiano per 2, 3 o 4 giocatori</p>

      <div class="name-field">
        <label class="field-label" for="nome-input">Il tuo nome</label>
        <input type="text" id="nome-input" placeholder="Es. Mario" maxlength="16" autocomplete="off">
      </div>

      <div class="lobby-actions">
        <button class="btn-card btn-primary" onclick="showCreate()">
          <span class="btn-icon">＋</span>
          Crea partita
        </button>
        <button class="btn-card btn-secondary" onclick="showJoin()">
          <span class="btn-icon">→</span>
          Entra in una stanza
        </button>
      </div>
    </div>

    <!-- SCHERMATA: CREA STANZA -->
    <div id="screen-create" class="screen">
      <div class="screen-back" onclick="showHome()">← Indietro</div>
      <h2 class="screen-title">Nuova partita</h2>

      <div class="field-group">
        <label class="field-label">Numero di giocatori</label>
        <div class="player-selector">
          <button class="ps-btn active" data-n="2" onclick="selectPlayers(2)">2</button>
          <button class="ps-btn" data-n="3" onclick="selectPlayers(3)">3</button>
          <button class="ps-btn" data-n="4" onclick="selectPlayers(4)">4</button>
        </div>
      </div>

      <button class="btn-card btn-primary" onclick="creaStanza()">Crea stanza</button>
      <p class="error-msg" id="err-create"></p>
    </div>

    <!-- SCHERMATA: ENTRA IN STANZA -->
    <div id="screen-join" class="screen">
      <div class="screen-back" onclick="showHome()">← Indietro</div>
      <h2 class="screen-title">Entra in partita</h2>

      <div class="name-field">
        <label class="field-label" for="room-input">Codice stanza</label>
        <input type="text" id="room-input" placeholder="Es. AB12C" maxlength="5"
          autocomplete="off" style="text-transform:uppercase; letter-spacing:4px; font-size:1.3rem; text-align:center">
      </div>

      <button class="btn-card btn-primary" onclick="entraStanza()">Entra</button>
      <p class="error-msg" id="err-join"></p>
    </div>

    <!-- SCHERMATA: SALA D'ATTESA -->
    <div id="screen-waiting" class="screen">
      <h2 class="screen-title">Sala d'attesa</h2>

      <div class="room-code-block">
        <span class="room-code-label">Codice stanza</span>
        <div class="room-code" id="room-code-display">—</div>
        <button class="btn-copy" onclick="copiaLink()">Copia link</button>
      </div>

      <div class="waiting-players" id="waiting-list"></div>

      <div class="waiting-hint" id="waiting-hint">
        In attesa degli altri giocatori…
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let selectedPlayers = 2;
    let myRoomId = null;

    // ── NAVIGAZIONE ──
    function showHome()   { goScreen('screen-home'); }
    function showCreate() { if (!checkNome()) return; goScreen('screen-create'); }
    function showJoin()   { if (!checkNome()) return; goScreen('screen-join'); }

    function goScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function checkNome() {
      const nome = document.getElementById('nome-input').value.trim();
      if (!nome) {
        document.getElementById('nome-input').focus();
        document.getElementById('nome-input').style.borderColor = '#c8392b';
        setTimeout(() => document.getElementById('nome-input').style.borderColor = '', 1200);
        return false;
      }
      return true;
    }

    function selectPlayers(n) {
      selectedPlayers = n;
      document.querySelectorAll('.ps-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.n) === n);
      });
    }

    // ── CREA STANZA ──
    function creaStanza() {
      const nome = document.getElementById('nome-input').value.trim();
      socket.emit('crea_stanza', { nome, maxGiocatori: selectedPlayers });
    }

    socket.on('stanza_creata', ({ roomId, giocatori }) => {
      myRoomId = roomId;
      document.getElementById('room-code-display').textContent = roomId;
      aggiornaWaiting(giocatori, selectedPlayers);
      goScreen('screen-waiting');
    });

    // ── ENTRA IN STANZA ──
    function entraStanza() {
      const nome   = document.getElementById('nome-input').value.trim();
      const roomId = document.getElementById('room-input').value.trim().toUpperCase();
      if (!roomId) { setErr('err-join', 'Inserisci il codice stanza.'); return; }
      socket.emit('entra_stanza', { nome, roomId });
    }

    socket.on('aggiornamento_lobby', ({ giocatori }) => {
      myRoomId = myRoomId || document.getElementById('room-code-display').textContent;
      aggiornaWaiting(giocatori, giocatori.length); // aggiorna
      goScreen('screen-waiting');
    });

    function aggiornaWaiting(giocatori, maxG) {
      const list = document.getElementById('waiting-list');
      list.innerHTML = giocatori.map(g => `
        <div class="waiting-player">
          <div class="wp-avatar">${g.nome[0].toUpperCase()}</div>
          <span>${g.nome}</span>
        </div>
      `).join('');
      document.getElementById('waiting-hint').textContent =
        giocatori.length < maxG
          ? `In attesa di ${maxG - giocatori.length} giocatore${maxG - giocatori.length > 1 ? 'i' : ''}…`
          : 'Tutti pronti! La partita sta per iniziare…';
    }

    // ── COPIA LINK ──
    function copiaLink() {
      const link = `${location.origin}?room=${myRoomId}`;
      navigator.clipboard.writeText(link).then(() => {
        document.querySelector('.btn-copy').textContent = 'Copiato!';
        setTimeout(() => document.querySelector('.btn-copy').textContent = 'Copia link', 2000);
      });
    }

    // ── PARTITA INIZIATA → redirect ──
    socket.on('partita_iniziata', (data) => {
      sessionStorage.setItem('briscola_game', JSON.stringify({
        ...data,
        socketId: socket.id,
        roomId: myRoomId || document.getElementById('room-code-display').textContent,
      }));
      window.location.href = 'game.html';
    });

    // ── ERRORI ──
    socket.on('errore', ({ msg }) => {
      setErr('err-join', msg);
      setErr('err-create', msg);
    });

    function setErr(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    // ── LINK DIRETTO CON CODICE STANZA ──
    (function() {
      const params = new URLSearchParams(location.search);
      const room   = params.get('room');
      if (room) {
        document.getElementById('room-input').value = room;
      }
    })();
  </script>
</body>
</html>
