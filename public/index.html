<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a0a00">
  <title>Briscola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════════════════════════════════════
     LOBBY
══════════════════════════════════════════════ -->
<div id="lobby" class="page-lobby">
  <div class="lobby-wrap">
    <div class="lobby-logo">
      <span class="logo-suit">♠</span>
      <div class="logo-text">Briscola</div>
      <span class="logo-suit red">♥</span>
    </div>

    <!-- HOME -->
    <div id="screen-home" class="screen active">
      <p class="lobby-sub">Gioco di carte italiano per 2, 3 o 4 giocatori</p>
      <div class="name-field">
        <label class="field-label">Il tuo nome</label>
        <input type="text" id="nome-input" placeholder="Es. Mario" maxlength="16" autocomplete="off">
      </div>
      <div class="lobby-actions">
        <button class="btn-card btn-primary" onclick="showCreate()">＋ Crea partita</button>
        <button class="btn-card btn-secondary" onclick="showJoin()">→ Entra in una stanza</button>
      </div>
    </div>

    <!-- CREA -->
    <div id="screen-create" class="screen">
      <div class="screen-back" onclick="showHome()">← Indietro</div>
      <h2 class="screen-title">Nuova partita</h2>
      <div class="field-group">
        <label class="field-label">Numero di giocatori</label>
        <div class="player-selector">
          <button class="ps-btn active" data-n="2" onclick="selectPlayers(2)">2</button>
          <button class="ps-btn" data-n="3" onclick="selectPlayers(3)">3</button>
          <button class="ps-btn" data-n="4" onclick="selectPlayers(4)">4</button>
        </div>
      </div>
      <button class="btn-card btn-primary" onclick="creaStanza()">Crea stanza</button>
      <p class="error-msg" id="err-create"></p>
    </div>

    <!-- ENTRA -->
    <div id="screen-join" class="screen">
      <div class="screen-back" onclick="showHome()">← Indietro</div>
      <h2 class="screen-title">Entra in partita</h2>
      <div class="name-field">
        <label class="field-label">Codice stanza</label>
        <input type="text" id="room-input" placeholder="Es. AB12C" maxlength="5"
          autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;font-size:1.3rem;text-align:center">
      </div>
      <button class="btn-card btn-primary" onclick="entraStanza()">Entra</button>
      <p class="error-msg" id="err-join"></p>
    </div>

    <!-- ATTESA -->
    <div id="screen-waiting" class="screen">
      <h2 class="screen-title">Sala d'attesa</h2>
      <div class="room-code-block">
        <span class="room-code-label">Codice stanza</span>
        <div class="room-code" id="room-code-display">—</div>
        <button class="btn-copy" onclick="copiaLink()">Copia link</button>
      </div>
      <div class="waiting-players" id="waiting-list"></div>
      <div class="waiting-hint" id="waiting-hint">In attesa degli altri giocatori…</div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     TAVOLO DI GIOCO
══════════════════════════════════════════════ -->
<div id="game-page" class="page-game" style="display:none">

  <div class="game-topbar">
    <span class="topbar-logo">♠ Briscola</span>
    <span class="deck-count" id="deck-count">🂠 —</span>
    <span class="my-score-badge">Punti: <strong id="my-score">0</strong></span>
  </div>

  <div class="tavolo">
    <div class="opponents-row" id="opponents-row"></div>

    <div class="tavolo-center">
      <div class="briscola-slot" id="briscola-slot">
        <div class="slot-label">Briscola</div>
        <div class="carta-placeholder"></div>
      </div>
      <div class="mazzo-slot">
        <div class="slot-label">Mazzo</div>
        <div class="mazzo-visual" id="mazzo-visual">
          <div class="carta-svg-wrap retro mazzo-carta"></div>
        </div>
        <div class="mazzo-count" id="mazzo-count">— carte</div>
      </div>
      <div class="played-area">
        <div class="slot-label">Mano in corso</div>
        <div class="played-cards" id="played-cards"></div>
      </div>
    </div>

    <div class="my-area">
      <div class="my-name-bar">
        <span id="my-name">Tu</span>
        <span class="turn-badge" id="turn-badge">Connessione…</span>
      </div>
      <div class="my-hand" id="my-hand"></div>
    </div>
  </div>

  <button class="btn-scores-open" onclick="openScores()" title="Punteggi">📊</button>
  <div class="scores-panel" id="scores-panel" style="display:none">
    <div class="scores-inner" id="scores-inner"></div>
    <button class="btn-scores-close" onclick="closeScores()">✕</button>
  </div>

  <div class="modal-overlay" id="modal-end" style="display:none">
    <div class="modal-box">
      <div class="modal-icon" id="modal-icon"></div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-subtitle" id="modal-subtitle"></div>
      <div class="results-list" id="results-list"></div>
      <button class="btn-card btn-primary" onclick="tornaLobby()" style="margin-top:1.5rem">Nuova partita</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="carte.js"></script>
<script>

// ══════════════════════════════════════════════
// STATO GLOBALE
// ══════════════════════════════════════════════
const socket = io();

let myNome       = '';
let myRoomId     = '';
let myToken      = '';   // token fisso assegnato dal server
let selectedPlayers = 2;
let gameState    = null; // { giocatori, briscola, turnoDi, punteggi, mazzoRimanente }
let myMano       = [];
let mioTurno     = false;
let punteggi     = {};

// ── COSTANTI ──────────────────────────────────
const SEMI_IT      = { bastoni:'Bastoni', coppe:'Coppe', denari:'Denari', spade:'Spade' };
const NOME_VALORE  = { 'A':'Asso','3':'Tre','K':'Re','Q':'Cavallo','J':'Fante','7':'Sette','6':'Sei','5':'Cinque','4':'Quattro','2':'Due' };
const PUNTI_VALORE = { 'A':11,'3':10,'K':4,'Q':3,'J':2,'7':0,'6':0,'5':0,'4':0,'2':0 };
const COLORE_SEME  = { bastoni:'#5a3000', coppe:'#8B0000', denari:'#7a6000', spade:'#1a1a3a' };
const SEME_SYM     = { bastoni:'🏑', coppe:'🏆', denari:'💰', spade:'⚔️' };

// ══════════════════════════════════════════════
// LOBBY
// ══════════════════════════════════════════════

function showHome()   { goLobbyScreen('screen-home'); }
function showCreate() { if (!checkNome()) return; goLobbyScreen('screen-create'); }
function showJoin()   { if (!checkNome()) return; goLobbyScreen('screen-join'); }

function goLobbyScreen(id) {
  document.querySelectorAll('#lobby .screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function checkNome() {
  const inp = document.getElementById('nome-input');
  if (!inp.value.trim()) {
    inp.style.borderColor = '#c8392b';
    inp.focus();
    setTimeout(() => inp.style.borderColor = '', 1200);
    return false;
  }
  return true;
}

function selectPlayers(n) {
  selectedPlayers = n;
  document.querySelectorAll('.ps-btn').forEach(b =>
    b.classList.toggle('active', parseInt(b.dataset.n) === n)
  );
}

function creaStanza() {
  myNome = document.getElementById('nome-input').value.trim();
  socket.emit('crea_stanza', { nome: myNome, maxGiocatori: selectedPlayers });
}

function entraStanza() {
  myNome = document.getElementById('nome-input').value.trim();
  const roomId = document.getElementById('room-input').value.trim().toUpperCase();
  if (!roomId) { setErr('err-join', 'Inserisci il codice stanza.'); return; }
  socket.emit('entra_stanza', { nome: myNome, roomId });
}

function copiaLink() {
  const link = `${location.origin}?room=${myRoomId}`;
  navigator.clipboard.writeText(link).then(() => {
    document.querySelector('.btn-copy').textContent = 'Copiato!';
    setTimeout(() => document.querySelector('.btn-copy').textContent = 'Copia link', 2000);
  });
}

function aggiornaWaiting(giocatori, maxG) {
  document.getElementById('waiting-list').innerHTML = giocatori.map(g => `
    <div class="waiting-player">
      <div class="wp-avatar">${g.nome[0].toUpperCase()}</div>
      <span>${g.nome}</span>
    </div>
  `).join('');
  const mancano = maxG - giocatori.length;
  document.getElementById('waiting-hint').textContent = mancano > 0
    ? `In attesa di ${mancano} giocatore${mancano > 1 ? 'i' : ''}…`
    : 'Tutti pronti! La partita sta per iniziare…';
}

function setErr(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
}

// ── Link diretto con codice ──
(function() {
  const room = new URLSearchParams(location.search).get('room');
  if (room) document.getElementById('room-input').value = room;
})();

// ══════════════════════════════════════════════
// SOCKET — LOBBY EVENTI
// ══════════════════════════════════════════════

socket.on('stanza_creata', ({ roomId, token, giocatori }) => {
  myRoomId = roomId;
  myToken  = token;
  document.getElementById('room-code-display').textContent = roomId;
  aggiornaWaiting(giocatori, selectedPlayers);
  goLobbyScreen('screen-waiting');
});

socket.on('aggiornamento_lobby', ({ giocatori, maxGiocatori }) => {
  if (!myRoomId) myRoomId = document.getElementById('room-code-display').textContent;
  aggiornaWaiting(giocatori, maxGiocatori);
  goLobbyScreen('screen-waiting');
});

socket.on('errore', ({ msg }) => {
  setErr('err-join', msg);
  setErr('err-create', msg);
  showToast('⚠ ' + msg, 3000);
});

// ══════════════════════════════════════════════
// SOCKET — GIOCO EVENTI
// ══════════════════════════════════════════════

socket.on('partita_iniziata', ({ token, giocatori, mano, briscola, turnoDi, punteggi: pts, mazzoRimanente }) => {
  myToken   = token;
  punteggi  = pts || {};
  gameState = { giocatori, briscola, turnoDi, mazzoRimanente };
  myMano    = mano;

  // Passa alla schermata di gioco
  document.getElementById('lobby').style.display     = 'none';
  document.getElementById('game-page').style.display = 'flex';

  document.getElementById('my-name').textContent = myNome;
  renderBriscola(briscola);
  renderOpponents(giocatori);
  renderMyHand();
  updateDeckCount(mazzoRimanente);
  updateAllScores();
  updateTurn(turnoDi);
});

socket.on('carta_giocata', ({ token, carta, carteGiocate }) => {
  gameState.carteGiocate = carteGiocate;
  renderPlayedCards(carteGiocate);
  // Riduci carte coperte avversario
  const g = gameState.giocatori.find(g => g.token === token && g.token !== myToken);
  if (g) {
    const handEl = document.getElementById(`hand-${g.token}`);
    if (handEl) {
      const cards = handEl.querySelectorAll('.carta-retro');
      if (cards.length > 0) cards[cards.length - 1].remove();
    }
  }
});

socket.on('turno', ({ token }) => {
  gameState.turnoDi = token;
  updateTurn(token);
});

socket.on('fine_mano', ({ vincitoreToken, carteGiocate, punteggi: pts }) => {
  punteggi = pts;
  const vG = gameState.giocatori.find(g => g.token === vincitoreToken);
  const vNome = vG ? vG.nome : '?';
  showToast(vincitoreToken === myToken ? '🃏 Hai preso la mano!' : `🃏 ${vNome} prende!`);
  updateAllScores();
  setTimeout(() => {
    document.getElementById('played-cards').innerHTML = '';
    gameState.carteGiocate = [];
  }, 1000);
});

socket.on('aggiornamento_mano', ({ mano, mazzoRimanente, punteggi: pts }) => {
  myMano   = mano;
  punteggi = pts || punteggi;
  renderMyHand();
  updateDeckCount(mazzoRimanente);
  updateAllScores();
});

socket.on('partita_finita', ({ risultati, vincitore }) => {
  showEndModal(risultati, vincitore);
});

socket.on('giocatore_disconnesso', ({ msg }) => {
  // Mostra messaggio ma non interrompere la partita — potrebbe riconnettersi
  showToast('⚠ ' + msg, 4000);
});

// ══════════════════════════════════════════════
// RENDER — usa SVG da carte.js
// ══════════════════════════════════════════════

function svgCarta(carta, extraClass = '') {
  const el = document.createElement('div');
  el.className = `carta-svg-wrap ${extraClass}`;
  el.innerHTML = getSVGCarta(carta);
  return el;
}

function svgRetro() {
  const el = document.createElement('div');
  el.className = 'carta-svg-wrap retro';
  el.innerHTML = SVG_RETRO;
  return el;
}

function renderBriscola(briscola) {
  const slot = document.getElementById('briscola-slot');
  slot.innerHTML = '<div class="slot-label">Briscola</div>';
  const wrap = svgCarta(briscola, 'briscola-card');
  slot.appendChild(wrap);
}

function renderOpponents(giocatori) {
  const row = document.getElementById('opponents-row');
  row.innerHTML = '';
  giocatori.filter(g => g.token !== myToken).forEach(g => {
    const div = document.createElement('div');
    div.className = 'opponent-slot';
    div.id = `opp-slot-${g.token}`;

    const handDiv = document.createElement('div');
    handDiv.className = 'opp-hand';
    handDiv.id = `hand-${g.token}`;
    handDiv.appendChild(svgRetro());
    handDiv.appendChild(svgRetro());
    handDiv.appendChild(svgRetro());

    div.innerHTML = `
      <div class="opp-avatar">${g.nome[0].toUpperCase()}</div>
      <div class="opp-info">
        <span class="opp-name">${g.nome}</span>
        <span class="opp-pts" id="pts-${g.token}">${punteggi[g.token] || 0} pt</span>
      </div>
    `;
    div.appendChild(handDiv);
    row.appendChild(div);
  });
}

function renderMyHand() {
  const container = document.getElementById('my-hand');
  container.innerHTML = '';
  myMano.forEach(carta => {
    const el = svgCarta(carta, 'mia-carta' + (mioTurno ? ' giocabile' : ''));
    if (mioTurno) el.onclick = () => giocaCarta(carta, el);
    container.appendChild(el);
  });
}

function renderPlayedCards(carteGiocate) {
  const container = document.getElementById('played-cards');
  container.innerHTML = '';
  (carteGiocate || []).forEach(cg => {
    const g    = gameState.giocatori.find(g => g.token === cg.token);
    const nome = g ? g.nome : '?';
    const wrap = document.createElement('div');
    wrap.className = 'played-card-wrap';
    const label = document.createElement('div');
    label.className = 'played-player-name';
    label.textContent = cg.token === myToken ? 'Tu' : nome;
    wrap.appendChild(label);
    wrap.appendChild(svgCarta(cg.carta, 'played'));
    container.appendChild(wrap);
  });
}

// ══════════════════════════════════════════════
// TURNO & GIOCA
// ══════════════════════════════════════════════

function updateTurn(token) {
  mioTurno = (token === myToken);
  const badge = document.getElementById('turn-badge');
  if (mioTurno) {
    badge.textContent = '🟢 Tuo turno!';
    badge.className   = 'turn-badge active';
  } else {
    const g = gameState.giocatori.find(g => g.token === token);
    badge.textContent = `⏳ Turno di ${g ? g.nome : '…'}`;
    badge.className   = 'turn-badge';
  }
  renderMyHand();
}

function giocaCarta(carta, el) {
  if (!mioTurno) return;
  mioTurno = false;
  if (el) { el.classList.add('playing'); el.onclick = null; }
  socket.emit('gioca_carta', { carta });
  myMano = myMano.filter(c => !(c.seme === carta.seme && c.valore === carta.valore));
  document.getElementById('turn-badge').textContent = '⏳ In attesa…';
  document.getElementById('turn-badge').className   = 'turn-badge';
}

// ══════════════════════════════════════════════
// PUNTEGGI & FINE
// ══════════════════════════════════════════════

function updateAllScores() {
  document.getElementById('my-score').textContent = punteggi[myToken] || 0;
  if (!gameState) return;
  gameState.giocatori.forEach(g => {
    const el = document.getElementById(`pts-${g.token}`);
    if (el) el.textContent = `${punteggi[g.token] || 0} pt`;
  });
}

function updateDeckCount(n) {
  document.getElementById('deck-count').textContent = `🂠 ${n}`;
  const mc = document.getElementById('mazzo-count');
  if (mc) mc.textContent = `${n} carte`;
  const mv = document.getElementById('mazzo-visual');
  if (mv) mv.style.opacity = n > 0 ? '1' : '0.2';
}
function openScores()  { document.getElementById('scores-panel').style.display = 'flex'; }
function closeScores() { document.getElementById('scores-panel').style.display = 'none'; }

function showEndModal(risultati, vincitore) {
  const isWinner = vincitore.token === myToken;
  document.getElementById('modal-icon').textContent    = isWinner ? '🏆' : '😔';
  document.getElementById('modal-title').textContent   = isWinner ? 'Hai vinto!' : `${vincitore.nome} vince!`;
  document.getElementById('modal-subtitle').textContent = `${vincitore.punti} punti su 120`;
  document.getElementById('results-list').innerHTML = risultati.map((r, i) => `
    <div class="result-row ${r.token === myToken ? 'is-me' : ''}">
      <span class="result-pos">${['🥇','🥈','🥉'][i] || (i+1)+'°'}</span>
      <span class="result-name">${r.nome}${r.token === myToken ? ' (Tu)' : ''}</span>
      <span class="result-pts">${r.punti} pt</span>
    </div>
  `).join('');
  document.getElementById('modal-end').style.display = 'flex';
}

function tornaLobby() {
  document.getElementById('modal-end').style.display  = 'none';
  document.getElementById('game-page').style.display  = 'none';
  document.getElementById('lobby').style.display      = 'flex';
  gameState = null; myMano = []; punteggi = {}; mioTurno = false;
  myToken = ''; myRoomId = '';
  goLobbyScreen('screen-home');
}

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════

let toastTimer = null;
function showToast(msg, ms = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visible'), ms);
}

</script>
</body>
</html>
